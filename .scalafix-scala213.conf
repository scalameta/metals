# Used by modules built only on Scala 2.13 with -Xsource:3 (see scala213OnlyScalafix in build.sbt).
# Keeps Scala 3 import syntax (`*`, `as`) instead of rewriting it back to `_` / `=>`.
rules = [
  OrganizeImports,
  ExplicitResultTypes,
  RemoveUnused
]

ExplicitResultTypes.rewriteStructuralTypesToNamedSubclass = false

RemoveUnused.imports = false

OrganizeImports.targetDialect = Scala3
OrganizeImports.groupedImports = Explode
OrganizeImports.expandRelative = true
OrganizeImports.removeUnused = true
OrganizeImports.groups = [
  "re:javax?\\."
  "scala."
  "scala.meta."
  "*"
]
